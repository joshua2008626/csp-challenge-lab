<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CSP Challenge Lab — learn Constraint Satisfaction Problems by playing: Map Coloring, Crypt-Arithmetic and N-Queens with real AI solvers." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CSP Challenge Lab — Think. Constrain. Solve.</title>
    <script>
      try {
        var t = localStorage.getItem('csp-lab-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
